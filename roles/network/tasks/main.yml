---
- name: Create systemd-resolved stub-resolv.conf symlink
  ansible.builtin.file:
    src: /run/systemd/resolve/stub-resolv.conf
    dest: /etc/resolv.conf
    state: link
    force: true

- name: Disable and stop systemd-networkd services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: false
    state: "{{ 'stopped' if systemd_is_booted else omit }}"
  loop:
    - systemd-networkd.service
    - systemd-networkd-wait-online.service

- name: Enable NetworkManager services
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - NetworkManager.service
    - NetworkManager-wait-online.service

- name: Ensure NetworkManager is started
  ansible.builtin.systemd_service:
    name: NetworkManager.service
    state: "{{ 'started' if systemd_is_booted else omit }}"

- name: Enable systemd-resolved service
  ansible.builtin.systemd_service:
    name: systemd-resolved.service
    enabled: true

- name: Ensure systemd-resolved is started
  ansible.builtin.systemd_service:
    name: systemd-resolved.service
    state: "{{ 'started' if systemd_is_booted else omit }}"

- name: Enable sshd service
  ansible.builtin.systemd_service:
    name: sshd.service
    enabled: true

- name: Ensure sshd is started
  ansible.builtin.systemd_service:
    name: sshd.service
    state: "{{ 'started' if systemd_is_booted else omit }}"
