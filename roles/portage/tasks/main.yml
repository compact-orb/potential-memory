---
# === Public Keys Management ===

- name: Create /etc/portage/keys directory
  ansible.builtin.file:
    path: /etc/portage/keys
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Install public keys
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "/etc/portage/keys/{{ item }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - binpkg.asc
    - automatic-journey-repo.asc
    - github.asc

# === GnuPG Binpkg Verification ===

- name: Initialize /etc/portage/gnupg with getuto
  ansible.builtin.command:
    cmd: getuto
  args:
    creates: /etc/portage/gnupg/trustdb.gpg

- name: Import binpkg key into Portage keyring
  ansible.builtin.command:
    cmd: >-
      gpg --batch --homedir /etc/portage/gnupg
      --import /etc/portage/keys/binpkg.asc
  register: gpg_import
  changed_when: "'imported: 1' in gpg_import.stderr"

- name: Set ultimate trust for binpkg key
  ansible.builtin.shell: |
    fpr=$(gpg --batch --homedir /etc/portage/gnupg \
      --with-colons --show-keys /etc/portage/keys/binpkg.asc | \
      awk --field-separator=":" '/^fpr/ {print $10; exit}')
    printf "%s\n" "${fpr}:6:" | \
      gpg --batch --homedir /etc/portage/gnupg --import-ownertrust
    gpg --batch --homedir /etc/portage/gnupg --check-trustdb
    chmod ugo+r /etc/portage/gnupg/trustdb.gpg
  changed_when: false

# === Ebuild Repositories ===

- name: Create /etc/portage/repos.conf directory
  ansible.builtin.file:
    path: /etc/portage/repos.conf
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure gentoo ebuild repository
  ansible.builtin.copy:
    dest: /etc/portage/repos.conf/gentoo.conf
    content: |
      [gentoo]
      location = /var/db/repos/gentoo
      sync-type = git
      sync-uri = https://github.com/gentoo-mirror/gentoo.git
      sync-git-verify-commit-signature = yes
      sync-openpgp-key-path = /usr/share/openpgp-keys/gentoo-release.asc
    owner: root
    group: root
    mode: '0644'

- name: Configure automatic-journey ebuild repository
  ansible.builtin.copy:
    dest: /etc/portage/repos.conf/automatic-journey.conf
    content: |
      [automatic-journey]
      location = /var/db/repos/automatic-journey
      sync-type = git
      sync-uri = https://github.com/compact-orb/automatic-journey.git
      sync-git-verify-commit-signature = yes
      sync-openpgp-key-path = /etc/portage/keys/automatic-journey-repo.asc
      sync-openpgp-key-refresh = false-nowarn
    owner: root
    group: root
    mode: '0644'

# === Binary Package Repositories ===

- name: Detect active Portage profile symlink
  ansible.builtin.stat:
    path: /etc/portage/make.profile
    follow: false
  register: profile_stat

- name: Verify /etc/portage/make.profile is a valid profile symlink
  ansible.builtin.assert:
    that:
      - profile_stat.stat.islnk is defined
      - profile_stat.stat.islnk
      - "'/profiles/' in profile_stat.stat.lnk_target"
    fail_msg: >-
      /etc/portage/make.profile is not a valid profile symlink.
      Cannot detect binpkg repository.
    quiet: true

- name: Extract detected repository and profile path
  ansible.builtin.set_fact:
    detected_repo: >-
      {{ profile_stat.stat.lnk_target.split('/profiles/')[0].split('/')[-1] }}
    detected_profile: >-
      {{ profile_stat.stat.lnk_target.split('/profiles/')[1] }}

- name: Create /etc/portage/binrepos.conf directory
  ansible.builtin.file:
    path: /etc/portage/binrepos.conf
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Configure binary package repository for detected repository
  ansible.builtin.copy:
    dest: "/etc/portage/binrepos.conf/{{ detected_repo }}.conf"
    content: |
      [{{ detected_repo }}]
      sync-uri = {{ binpkg_repositories[detected_repo] }}/{{ detected_profile }}
    owner: root
    group: root
    mode: '0644'
  when: detected_repo in binpkg_repositories
