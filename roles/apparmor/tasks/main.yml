---
- name: Create /var/cache/apparmor with mode 0700
  ansible.builtin.file:
    path: /var/cache/apparmor
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Create AppArmor configuration directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /etc/apparmor
    - /etc/apparmor/flags.d
    - /etc/apparmor.d/local
    - /etc/apparmor.d/abstractions/authentication.d

- name: Copy /etc/apparmor/modes
  ansible.builtin.copy:
    src: modes
    dest: /etc/apparmor/modes
    owner: root
    group: root
    mode: '0644'
  notify: Reinstall and reload AppArmor profiles

- name: Copy AppArmor flag overrides to /etc/apparmor/flags.d
  ansible.builtin.copy:
    src: flags.d/
    dest: /etc/apparmor/flags.d/
    owner: root
    group: root
    mode: '0644'
  notify: Reinstall and reload AppArmor profiles

- name: Copy /etc/apparmor/parser.conf
  ansible.builtin.copy:
    src: parser.conf
    dest: /etc/apparmor/parser.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload AppArmor profiles

- name: Copy Gentoo PAM AppArmor abstraction
  ansible.builtin.copy:
    src: abstractions/gentoo.conf
    dest: /etc/apparmor.d/abstractions/authentication.d/gentoo.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload AppArmor profiles

- name: Copy local AppArmor profile overrides
  ansible.builtin.copy:
    src: local/
    dest: /etc/apparmor.d/local/
    owner: root
    group: root
    mode: '0644'
  notify: Reload AppArmor profiles

- name: Remove old local AppArmor profile overrides
  ansible.builtin.file:
    path: "/etc/apparmor.d/local/{{ item }}"
    state: absent
  loop:
    - aa-install
    - aa-mode
  notify: Reload AppArmor profiles

- name: Enable and start auditd.service
  ansible.builtin.systemd_service:
    name: auditd.service
    enabled: true
    state: "{{ 'started' if systemd_is_booted else omit }}"

- name: Install apparmor.d profiles
  ansible.builtin.command:
    cmd: >-
      aa-install --install{{ ' --no-reload' if not systemd_is_booted else '' }}
  environment:
    DISTRIBUTION: arch
  args:
    creates: /etc/apparmor/install.db

- name: Enable and start apparmor.service
  ansible.builtin.systemd_service:
    name: apparmor.service
    enabled: true
    state: "{{ 'started' if systemd_is_booted else omit }}"
