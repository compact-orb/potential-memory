---
- name: Create /etc/security/limits.d
  ansible.builtin.file:
    path: /etc/security/limits.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable core dumps in /etc/security/limits.d
  ansible.builtin.copy:
    src: disable-coredump-limits.conf
    dest: /etc/security/limits.d/10-disable-coredump.conf
    owner: root
    group: root
    mode: '0644'

- name: Create /etc/systemd/coredump.conf.d
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable systemd-coredump storage
  ansible.builtin.copy:
    src: disable-coredump-systemd.conf
    dest: /etc/systemd/coredump.conf.d/disable-coredump.conf
    owner: root
    group: root
    mode: '0644'

- name: Create /etc/systemd/system.conf.d
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Set DefaultLimitCORE=0 in systemd
  ansible.builtin.copy:
    src: disable-coredump-system.conf
    dest: /etc/systemd/system.conf.d/disable-coredump.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd manager

- name: Check if /etc/cron.daily exists
  ansible.builtin.stat:
    path: /etc/cron.daily
  register: cron_daily_stat

- name: Set /etc/cron.daily permissions to 0700
  ansible.builtin.file:
    path: /etc/cron.daily
    mode: '0700'
    owner: root
    group: root
  when: cron_daily_stat.stat.exists

- name: Set SHA_CRYPT_MAX_ROUNDS to 50000 in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*SHA_CRYPT_MAX_ROUNDS\s+[0-9]+'
    line: 'SHA_CRYPT_MAX_ROUNDS 50000'
    state: present

- name: Set SHA_CRYPT_MIN_ROUNDS to 50000 in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*SHA_CRYPT_MIN_ROUNDS\s+[0-9]+'
    line: 'SHA_CRYPT_MIN_ROUNDS 50000'
    state: present

- name: Set UMASK to 027 in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*UMASK\s+[0-9]+'
    line: 'UMASK 027'
    state: present

- name: Create /etc/modprobe.d
  ansible.builtin.file:
    path: /etc/modprobe.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy kernel module blacklist to /etc/modprobe.d
  ansible.builtin.copy:
    src: security-blacklist.conf
    dest: /etc/modprobe.d/security-blacklist.conf
    owner: root
    group: root
    mode: '0644'

- name: Create /etc/sudoers.d
  ansible.builtin.file:
    path: /etc/sudoers.d
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Allow passwordless sudo for wheel group
  ansible.builtin.copy:
    content: "%wheel ALL=(ALL:ALL) NOPASSWD: ALL\n"
    dest: /etc/sudoers.d/wheel
    owner: root
    group: root
    mode: '0440'

- name: Create /etc/sysctl.d
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy security sysctl config to /etc/sysctl.d
  ansible.builtin.copy:
    src: 99-security.conf
    dest: /etc/sysctl.d/99-security.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply security sysctl settings
