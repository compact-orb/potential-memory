---
- name: Ensure /etc/security/limits.d exists
  ansible.builtin.file:
    path: /etc/security/limits.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable core dumps via security limits
  ansible.builtin.copy:
    src: disable-coredump-limits.conf
    dest: /etc/security/limits.d/10-disable-coredump.conf
    owner: root
    group: root
    mode: '0644'

- name: Ensure /etc/systemd/coredump.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/coredump.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable systemd-coredump storage
  ansible.builtin.copy:
    src: disable-coredump-systemd.conf
    dest: /etc/systemd/coredump.conf.d/disable-coredump.conf
    owner: root
    group: root
    mode: '0644'

- name: Ensure /etc/systemd/system.conf.d exists
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Disable systemd default core limit
  ansible.builtin.copy:
    src: disable-coredump-system.conf
    dest: /etc/systemd/system.conf.d/disable-coredump.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd manager

- name: Check /etc/cron.daily existence
  ansible.builtin.stat:
    path: /etc/cron.daily
  register: cron_daily_stat

- name: Restrict /etc/cron.daily permissions
  ansible.builtin.file:
    path: /etc/cron.daily
    mode: '0700'
    owner: root
    group: root
  when: cron_daily_stat.stat.exists

- name: Configure password hashing maximum rounds in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*SHA_CRYPT_MAX_ROUNDS\s+[0-9]+'
    line: 'SHA_CRYPT_MAX_ROUNDS 50000'
    state: present

- name: Configure password hashing minimum rounds in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*SHA_CRYPT_MIN_ROUNDS\s+[0-9]+'
    line: 'SHA_CRYPT_MIN_ROUNDS 50000'
    state: present

- name: Configure strict umask in /etc/login.defs
  ansible.builtin.lineinfile:
    path: /etc/login.defs
    regexp: '^#?\s*UMASK\s+[0-9]+'
    line: 'UMASK 027'
    state: present

- name: Ensure /etc/modprobe.d exists
  ansible.builtin.file:
    path: /etc/modprobe.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy module blacklist configuration
  ansible.builtin.copy:
    src: security-blacklist.conf
    dest: /etc/modprobe.d/security-blacklist.conf
    owner: root
    group: root
    mode: '0644'

- name: Ensure /etc/sysctl.d exists
  ansible.builtin.file:
    path: /etc/sysctl.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Deploy sysctl hardening configuration
  ansible.builtin.copy:
    src: 99-security.conf
    dest: /etc/sysctl.d/99-security.conf
    owner: root
    group: root
    mode: '0644'
  notify: Apply sysctl configuration

