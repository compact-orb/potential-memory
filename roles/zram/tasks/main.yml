---
- name: Create /etc/systemd/zram-generator.conf.d
  ansible.builtin.file:
    path: /etc/systemd/zram-generator.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'

- name: Copy zram.conf to /etc/systemd/zram-generator.conf.d
  ansible.builtin.copy:
    src: zram.conf
    dest: /etc/systemd/zram-generator.conf.d/zram.conf
    owner: root
    group: root
    mode: '0644'
  notify: Reload systemd manager
