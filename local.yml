---
- name: Configuration
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - vars/main.yml

  pre_tasks:
    - name: Check if systemd is running
      ansible.builtin.command:
        cmd: systemctl is-system-running
      register: _systemd_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Set systemd active fact
      ansible.builtin.set_fact:
        systemd_is_booted: >-
          {{ _systemd_check.stdout in
             ['running', 'degraded', 'starting'] }}

  roles:
    - ansible_pull
    - bootloader
    - network
    - portage
    - security
    - apparmor
    - zram
